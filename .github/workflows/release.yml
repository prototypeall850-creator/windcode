name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: sh scripts/bundle.sh
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent: a release can already exist when the tag was created
          # manually (creating a release via API also pushes the tag, which
          # re-triggers this workflow).
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              windcode-bundle.tar.gz windcode-bundle.tar.gz.sha256
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              windcode-bundle.tar.gz windcode-bundle.tar.gz.sha256
          fi
